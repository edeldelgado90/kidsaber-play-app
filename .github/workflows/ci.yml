name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test -- --ci --coverage

      # Threshold is `critical` because brace-expansion (GHSA-mh99-v99m-4gvg, high)
      # has no patch compatible with the minimatch versions pinned by eslint, jest
      # and @react-native/codegen: only brace-expansion@5.0.8 fixes it, and its
      # exports map breaks minimatch 3.x. It is reached solely through build-time
      # glob matching over our own patterns. Restore `high` once upstream updates.
      - name: Security audit
        run: npm audit --audit-level=critical
