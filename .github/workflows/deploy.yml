name: Deploy (EAS Build + Submit)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (production)
        run: eas build --platform android --profile production --non-interactive
        # EXPO_PUBLIC_API_URL must be set in the Expo dashboard (Project → Environment Variables)
        # Setting it here only reaches the CLI process, not the EAS cloud build worker

      - name: Write Google service account key
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}' > google-service-account.json

      - name: Submit to Google Play (internal track)
        run: eas submit --platform android --profile production --non-interactive
